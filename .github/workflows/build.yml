name: Build MPDroid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install legacy Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "build-tools;21.1.1" \
            "build-tools;35.0.0" \
            "extras;android;m2repository"

          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Set up Java for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Remove obsolete Crashlytics configuration for FOSS build
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("MPDroid/build.gradle")
          text = path.read_text()

          start = text.index("buildscript {")
          end = text.index("apply plugin: 'com.android.application'", start)
          block = text[start:end]

          if "crashlytics-gradle" not in block:
              raise RuntimeError("Unexpected buildscript configuration")

          text = text[:start] + text[end:]

          for line in (
              "apply plugin: 'crashlytics'",
              "    maven { url 'http://download.crashlytics.com/maven' }",
              "    closedbitsCompile 'com.crashlytics.android:crashlytics:1.+'",
          ):
              if text.count(line) != 1:
                  raise RuntimeError(f"Expected exactly one occurrence: {line}")
              text = text.replace(line, "")

          path.write_text(text)
          PY

      - name: Build unsigned FOSS release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :MPDroid:assembleFossRelease \
            :JMPDCommJava:build

      - name: Set up Java for signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          shopt -s nullglob
          apks=(MPDroid/build/outputs/apk/*foss*release*unsigned.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one unsigned FOSS release APK"
            exit 1
          fi

          keystore="$RUNNER_TEMP/dmix-release.jks"
          aligned="$RUNNER_TEMP/dmix-aligned.apk"
          trap 'rm -f "$keystore" "$aligned"' EXIT
          umask 077

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore"

          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p MPDroid/build/outputs/signed
          output="MPDroid/build/outputs/signed/MPDroid-foss-release.apk"

          "$tools/zipalign" -f 4 "${apks[0]}" "$aligned"

          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            "$aligned"

          "$tools/apksigner" verify --verbose --print-certs "$output"
          "$tools/zipalign" -c 4 "$output"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MPDroid-foss-release
          path: MPDroid/build/outputs/signed/MPDroid-foss-release.apk
          if-no-files-found: error
          retention-days: 14
